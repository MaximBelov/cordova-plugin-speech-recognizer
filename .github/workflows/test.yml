name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  android-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm run test:android

  ios-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The Cordova headers come from cordova-ios, which is not a dependency of this repository.
      - run: npm install --no-save --prefix .cordova-headers cordova-ios@8.1.1
      - run: npm run test:ios
        env:
          CORDOVA_HEADERS: ${{ github.workspace }}/.cordova-headers/node_modules/cordova-ios/CordovaLib/include/Cordova
