// JVM unit tests for the plugin's pure Java. The plugin itself needs cordova-android and an Activity, so only
// the files that have no Android types are compiled here, straight from the plugin source tree.
plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir '../../src/android/com/pbakondy'
            include 'SilenceTimeouts.java'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}
